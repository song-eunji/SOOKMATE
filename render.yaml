# Render 에서 이 파일로 한 번에 만든다 (Blueprint). 비밀 값(sync: false)은 Render 화면에서 직접 넣는다.
services:
  - type: web
    name: sookmate
    runtime: docker
    plan: free
    healthCheckPath: /api/options
    envVars:
      - key: DEV_MODE
        value: "0"
      - key: DEV_LOGIN
        value: "0"
      - key: DEMO_PARTNERS
        value: "0"
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
